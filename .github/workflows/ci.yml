name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt found unformatted files, run: gofmt -w ."
            exit 1
          fi

      - name: Unit tests
        run: go test ./...

      - name: bwrap integration tests
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          make test-integration
